name: Production CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy-backend:
    name: Deploy Backend to Bluehost VPS
    runs-on: ubuntu-latest
    # Only run if backend, nginx, compose, or workflows changed
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute Remote SSH Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 [CI/CD] Starting automated deployment on Bluehost VPS..."
            cd /var/www/aotms/telecommunication
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build --remove-orphans
            docker image prune -f
            echo "✅ [CI/CD] Automated deployment successful! Backend is running healthy."
