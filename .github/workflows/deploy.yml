name: Production CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy-backend:
    name: Deploy Backend to Bluehost VPS
    runs-on: ubuntu-latest
    # Only run if backend, nginx, compose, or workflows changed
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute Remote SSH Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          # Must stay false: with script_stop the shell dies at the first failing
          # command, which is docker compose up — before any diagnostics run. That
          # is why three failed deploys printed no backend logs at all. Errors are
          # handled explicitly below instead.
          script_stop: false
          script: |
            echo "🚀 [CI/CD] Starting automated deployment on Bluehost VPS..."
            cd /var/www/aotms/telecommunication
            git fetch origin main
            git reset --hard origin/main

            # Clean up old n8n Meta Leads variables if present in backend/.env on VPS
            sed -i '/N8N_META_LEADS_WEBHOOK_URL/d' backend/.env || true
            sed -i '/N8N_META_LEADS_WORKFLOW_ID/d' backend/.env || true

            # `--wait` cannot be used here: the worker deliberately ships with its
            # healthcheck disabled (it has no HTTP listener), and compose aborts the
            # whole run with "container aotms-worker has no healthcheck configured"
            # even when every container is fine. Wait on the API container instead.
            # Its exit code is captured rather than raised, so the diagnostics below
            # always run.
            docker compose up -d --build --remove-orphans
            compose_rc=$?

            echo "[CI/CD] Waiting for backend health (max 180s)..."
            healthy="no"
            i=1
            while [ "$i" -le 45 ]; do
              status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' aotms-backend 2>/dev/null || echo missing)
              if [ "$status" = "healthy" ]; then healthy="yes"; break; fi
              if [ "$status" = "missing" ]; then break; fi
              sleep 4
              i=$((i + 1))
            done

            # Always dump state, resources and logs: the previous version printed
            # only "container is unhealthy" and nothing else, which told us nothing
            # about why the process died.
            echo "[CI/CD] Container state:"
            docker compose ps -a || true
            echo "[CI/CD] Backend state:"
            docker inspect --format 'status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} restarts={{.RestartCount}}' aotms-backend || true
            echo "[CI/CD] Host resources:"
            free -h || true
            df -h / || true
            echo "[CI/CD] Backend logs (last 200 lines):"
            docker compose logs --tail=200 backend || true
            echo "[CI/CD] Worker logs (last 80 lines):"
            docker compose logs --tail=80 worker || true

            if [ "$compose_rc" -ne 0 ] || [ "$healthy" != "yes" ]; then
              echo "[CI/CD] FAILED: backend did not become healthy (compose exit ${compose_rc}, health ${status})."
              exit 1
            fi

            docker image prune -f
            echo "✅ [CI/CD] Automated deployment successful! Backend is running healthy."
