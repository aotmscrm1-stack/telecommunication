services:
  # ── 1. BACKEND API & SOCKETS SERVICE ─────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aotms-backend
    restart: always
    env_file:
      - ./backend/.env
    networks:
      aotms-network:
        ipv4_address: 172.28.0.10
    volumes:
      - backend-uploads:/app/uploads
    deploy:
      resources:
        limits:
          cpus: '1.50'
          memory: 1536M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ── 2. NGINX GATEWAY & REVERSE PROXY ──────────────────────────────────────
  nginx-gateway:
    image: nginx:alpine
    container_name: aotms-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - backend-uploads:/var/www/uploads:ro
    networks:
      aotms-network:
        ipv4_address: 172.28.0.20
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

networks:
  aotms-network:
    name: aotms-network
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16

volumes:
  backend-uploads:
    name: aotms_backend_uploads
    driver: local
