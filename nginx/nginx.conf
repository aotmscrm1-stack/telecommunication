upstream backend_service {
    server backend:5000;
}

# 1. HTTP Server - Redirect to HTTPS (with ACME challenge support)
server {
    listen 80;
    server_name api.academyoftechmasters.com;

    # Certbot challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Production HTTPS Server
server {
    listen 443 ssl http2;
    server_name api.academyoftechmasters.com;

    # SSL Certificate Paths (Mount points from Certbot volume)
    ssl_certificate /etc/letsencrypt/live/api.academyoftechmasters.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.academyoftechmasters.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Maximum upload body size (50MB for call recordings & bulk imports)
    client_max_body_size 50M;

    # ── A. ROOT / HEALTH CHECK PASS TO BACKEND ──────────────────────────────
    location / {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }

    # ── B. BACKEND REST API ─────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend_service/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }

    # ── C. WEBSOCKETS (SOCKET.IO) ───────────────────────────────────────────
    location /socket.io/ {
        proxy_pass http://backend_service/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── D. NATIVE WEBSOCKETS (/ws) ──────────────────────────────────────────
    location /ws {
        proxy_pass http://backend_service/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # ── E. DIRECT APK DOWNLOAD ──────────────────────────────────────────────
    location /download-apk {
        proxy_pass http://backend_service/download-apk;
        proxy_set_header Host $host;
    }

    # ── F. LOCAL RECORDINGS & UPLOADS STREAMING ──────────────────────────────
    location /uploads/ {
        alias /var/www/uploads/;
        autoindex off;
        add_header Accept-Ranges bytes;
        add_header Access-Control-Allow-Origin *;
        expires 7d;
    }
}
